<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת תומכת החלטה</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/Header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/Footer.css') }}">
    {% block css %}{% endblock %}
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="page-container">
        <!-- HEADER -->
    <header>
    <div class="header-content">
        <h1><a href="/">Geometric Akinator</a></h1>
        <nav>
            <ul>
                <li class="contact-icon">
                    <a href="{{ url_for('contact_page.contact') }}" title="צור קשר">
                        <i class="fa-solid fa-envelope"></i>
                    </a>
                </li>

                {% if session.get('user') %}
                    <li>
                        <a href="{{ url_for('login_page.logout') }}" title="התנתק">
                            <i class="fas fa-sign-out-alt"></i>
                        </a>
                    </li>
                    <li>
                        <a href="{{ url_for('user_profile_page.profile') }}" title="פרופיל">
                            <i class="fa-regular fa-circle-user profile-icon"></i>
                        </a>
                    </li>
                {% else %}
                    <li>
                        <a href="{{ url_for('login_page.login') }}" title="התחבר">
                            <i class="fa-regular fa-circle-user profile-icon"></i>
                        </a>
                    </li>
                {% endif %}
            </ul>
        </nav>
    </div>
</header>

        <!-- MAIN CONTENT -->
        <main class="content-wrap">
            {% block content %}
            {% endblock %}
        </main>

        <!-- FOOTER -->
        <footer>
            <p>&copy; 2024 כל הזכויות שמורות. מערכת תומכת החלטה לתלמידי תיכון</p>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
