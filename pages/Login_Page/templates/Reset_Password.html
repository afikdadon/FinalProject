<!--Reset_Password.html (place in Login_Page/templates)-->
{% extends "base.html" %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('login_page.static', filename='css/Login_Page.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-image-section">
        <img src="{{ url_for('static', filename='media/login.png') }}" alt="Reset Password Image" />
    </div>
    <div class="login-form">
        <h1>איפוס סיסמה</h1>
        <form method="POST" action="{{ url_for('login_page.reset_password', token=token) }}" id="resetPasswordForm" novalidate>
            <div class="form-group">
                <label for="new_password">סיסמה חדשה</label>
                <div class="password-container">
                    <input type="password" id="new_password" name="new_password" required>
                    <button type="button" class="toggle-password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_password">אימות סיסמה</label>
                <div class="password-container">
                    <input type="password" id="confirm_password" name="confirm_password" required>
                    <button type="button" class="toggle-password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-button">עדכן סיסמה</button>
        </form>

        <div class="additional-options">
            <a href="{{ url_for('login_page.login') }}" class="back-to-login">חזרה להתחברות</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('login_page.static', filename='js/Reset_Password.js') }}"></script>
{% endblock %}
