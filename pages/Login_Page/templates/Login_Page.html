{% extends "base.html" %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('login_page.static', filename='css/Login_Page.css') }}">
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-image-section">
        <img src="{{ url_for('static', filename='media/login.png') }}" />
    </div>
    <div class="login-form">
        <h1>התחברות למערכת</h1>
        <form method="POST" action="{{ url_for('login_page.login') }}">
            <div class="form-group">
                <label for="email">אימייל</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">סיסמה</label>
                <div class="password-container">
                    <input type="password" id="password" name="password" required>
                    <button type="button" class="toggle-password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-button">התחבר</button>
        </form>

        <div class="additional-options">
            <a href="#" class="forgot-password">שכחת סיסמה? לחץ כאן</a>
            <a href="#" class="register-link">עדיין לא רשום? פתח חשבון חדש</a>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const togglePassword = document.querySelector('.toggle-password');
    const passwordInput = document.querySelector('#password');

    togglePassword.addEventListener('click', function() {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.querySelector('i').classList.toggle('fa-eye');
        this.querySelector('i').classList.toggle('fa-eye-slash');
    });
});
</script>
{% endblock %}
